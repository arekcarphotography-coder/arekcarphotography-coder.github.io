<script>
const slug = PAGE.slug || new URLSearchParams(location.search).get("a");
// stary adres album.html?a=… → nowy adres albumu
if (!PAGE.slug && slug && ALBUMS.some(a => a.slug === slug)) location.replace(URLS.album(slug));
const idx = Math.max(0, ALBUMS.findIndex(a => a.slug === slug));
const A = ALBUMS[idx];
const TR = TRIPS.find(x => x.slug === A.trip);
// „Następny album” = pierwszy album spoza tego samego wyjazdu (rodzeństwo jest w pasku „Inne z tego weekendu”)
const N = ALBUMS.slice(idx + 1).concat(ALBUMS.slice(0, idx)).find(a => !TR || a.trip !== A.trip) || ALBUMS[(idx + 1) % ALBUMS.length];

window.renderPage = () => {
  const title = L(A.title);
  document.title = A.tbc ? `${title} | Arek Carphotography` : `${title} — ${L(A.place)} | Arek Carphotography`;
  $('meta[name="description"]').content = L(A.desc);
  const items = photoItems(A);

  $("#page").innerHTML = `
  <section class="ahero" style="padding:0">
    ${pic(A.slug, A.hero, `${title} — ${L(A.place)}`, "100vw", 'fetchpriority="high"')}
    <div class="wrap">
      ${TR ? `<a class="tripbar" href="${URLS.trip(TR.slug)}">${t("trip.label")} · ${L(TR.title)}</a>` : ""}
      <nav class="crumbs" aria-label="breadcrumb"><a href="${URLS.home()}">${t("album.home")}</a><span>/</span><a href="${URLS.home()}#albums">${t("album.albums")}</a><span>/</span>${TR ? `<a href="${URLS.trip(TR.slug)}">${L(TR.title)}</a><span>/</span>` : ""}${title}</nav>
      <h1>${title}</h1>
      <div class="ameta"><span><b>●</b> ${L(A.place)}</span>${A.noDate ? "" : `<span>${fmtDate(A.date)}</span>`}<span>${photosLabel(A.photos.length)}</span><span>${L(KIND[A.kind])}</span></div>
    </div>
  </section>
  <section style="padding-top:clamp(40px,6vw,72px)"><div class="wrap">
    <p class="adesc reveal">${L(A.desc)}</p>
    <div class="grid" id="grid">${gridHTML(items)}</div>
  </div></section>
  ${TR ? `<section class="related"><div class="wrap">
    <div class="related-head reveal"><h2>${t("trip.more")}</h2><a href="${URLS.trip(TR.slug)}">${t("trip.all")}</a></div>
    <div class="albums">${tripAlbums(TR).filter(a => a !== A).map(albumCard).join("")}</div>
  </div></section>` : ""}
  <a class="next" href="${URLS.album(N.slug)}">
    ${pic(N.slug, N.hero, L(N.title), "100vw")}
    <div><span class="eyebrow">${t("album.next")} →</span><h2>${L(N.title)}</h2><p style="color:#ccc">${L(N.place)}</p></div>
  </a>`;
  bindGrid($("#grid"), items);
  requestAnimationFrame(() => $(".ahero").classList.add("ready"));

  // Dane strukturalne galerii dla Google
  let ld = $("#ld"); if (!ld) { ld = document.createElement("script"); ld.type = "application/ld+json"; ld.id = "ld"; document.head.append(ld); }
  ld.textContent = JSON.stringify({ "@context": "https://schema.org", "@type": "ImageGallery", name: title, description: L(A.desc),
    datePublished: A.noDate || A.tbc ? undefined : A.date, contentLocation: A.tbc ? undefined : { "@type": "Place", name: L(A.place) },
    author: { "@type": "Person", name: "Arek", url: SITE_URL + "/" },
    image: items.map(p => ({ "@type": "ImageObject", contentUrl: p.src, name: p.alt, creator: { "@type": "Person", name: "Arek Carphotography" } })) });
};
applyLang();
