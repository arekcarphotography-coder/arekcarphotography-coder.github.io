  </div>

<script src="assets/photos.js?v=20261119p"></script>
<script src="assets/data.js?v=20261119p"></script>
<script src="assets/app.js?v=20261119p"></script>
<script src="assets/hero.js?v=20261119p"></script>
<script>
let cat = "all";
// Wybrane kadry: po kilka z każdego albumu (rozłożone po całym albumie, żeby była różnorodność)
const pick = (list, n) => list.length <= n ? list : Array.from({ length: n }, (_, i) => list[Math.floor(i * list.length / n)]);
const allPhotos = () => ALBUMS.flatMap(a => photoItems(a, pick(a.photos, a.kind === "event" ? 5 : 3), true)
  .map(p => ({ ...p, cats: [TRIPS.find(t => t.slug === a.trip)?.filter, a.kind === "car" ? "car" : null] })));
// Przeplatamy albumy, żeby obok siebie nie stało 5 zdjęć tego samego auta
const interleave = items => { const by = {}; items.forEach(p => (by[p.album] ||= []).push(p));
  const out = [], q = Object.values(by); while (q.some(x => x.length)) q.forEach(x => x.length && out.push(x.shift())); return out; };

function renderGrid() {
  const items = interleave(allPhotos().filter(p => cat === "all" || p.cats.includes(cat)));
  $("#grid").innerHTML = gridHTML(items); bindGrid($("#grid"), items); observe();
}

// Zdjęcie w sekcji „O mnie” — docelowo Twój portret albo zdjęcie Ciebie przy pracy
$("#aboutImg").innerHTML = pic("koenigsegg-cc850", "dsc07731", "Arek Carphotography — fotograf samochodowy", "(max-width: 860px) 100vw, 50vw");
$("#statAlbums").dataset.count = ALBUMS.length;
$("#statPhotos").dataset.count = Math.floor(ALBUMS.reduce((n, a) => n + a.photos.length, 0) / 10) * 10;

window.renderPage = () => {
  document.title = t("meta.title");
  $('meta[name="description"]').content = t("meta.desc");
  if (window.heroLang) heroLang();
  $("#filters").innerHTML = Object.entries(CATS).map(([k, v]) => `<button data-c="${k}" class="${k === cat ? "on" : ""}">${L(v)}</button>`).join("");
  renderGrid();
  // Wyjazdy jako szerokie kafle, a albumy z wyjazdów są dostępne na ich stronie zbiorczej
  $("#albumList").innerHTML = TRIPS.map(tripCard).join("") + ALBUMS.filter(a => !a.trip).map(albumCard).join("");
  $("#posts").innerHTML = [...POSTS].sort((a, b) => b.date.localeCompare(a.date)).map(p => `<article class="post reveal"><a href="${URLS.post(p.slug)}">
    ${pic(p.img[0], p.img[1], L(p.t), "(max-width: 700px) 100vw, 33vw")}<time datetime="${p.date}">${fmtDate(p.date)}</time>
    <h3><span>${L(p.t)}</span></h3><p>${L(p.d)}</p><span class="more">${t("blog.more")}</span></a></article>`).join("");
};
$("#filters").onclick = e => { const b = e.target.closest("button"); if (!b) return;
  cat = b.dataset.c; $$("#filters button").forEach(x => x.classList.toggle("on", x === b)); renderGrid(); };

applyLang();

// Liczniki
const cio = new IntersectionObserver(es => es.forEach(e => { if (!e.isIntersecting) return;
  const b = e.target, n = +b.dataset.count, st = performance.now();
  (function f(now) { const k = Math.min((now - st) / 1600, 1); b.textContent = Math.round(n * (1 - Math.pow(1 - k, 3))) + (k === 1 && b.dataset.plus ? "+" : ""); if (k < 1) requestAnimationFrame(f); })(st);
  cio.unobserve(b); }));
$$("[data-count]").forEach(b => cio.observe(b));
</script>
