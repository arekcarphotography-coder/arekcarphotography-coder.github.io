<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base href="/">
<!-- SEO:START (generowane przez tools/build_site.rb — nie edytuj ręcznie) -->
<title>Arek Carphotography</title>
<meta name="description" content="">
<meta name="robots" content="noindex,follow">
<!-- SEO:END -->
<meta name="theme-color" content="#0d0d0d">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css?v=20261119q">
</head>
<body>
<main id="page"></main>

<script src="assets/photos.js?v=20261119q"></script>
<script src="assets/data.js?v=20261119q"></script>
<script src="assets/app.js?v=20261119q"></script>
<script>
const pslug = PAGE.slug || new URLSearchParams(location.search).get("p");
const P = POSTS.find(x => x.slug === pslug) || POSTS[0];
if (!PAGE.slug && pslug && POSTS.some(x => x.slug === pslug)) location.replace(URLS.post(pslug));

window.renderPage = () => {
  const title = L(P.t), TR = TRIPS.find(x => x.slug === P.trip);
  document.title = `${title} | Arek Carphotography`;
  $('meta[name="description"]').content = L(P.d);

  // Wszystkie zdjęcia wpisu trafiają do jednego lightboxa
  const items = [];
  const block = b => {
    let html = "";
    if (b.h) html += `<h2 class="reveal">${L(b.h)}</h2>`;
    if (b.p) html += `<p class="reveal${b.h ? "" : " lead"}">${L(b.p)}</p>`;
    if (b.photos) {
      html += `<div class="pics${b.photos.length === 1 ? " one" : ""} reveal">` + b.photos.map(([a, n]) => {
        const al = findAlbum(a), i = items.length;
        items.push({ album: a, name: n, src: photo(a, n, 2048), alt: `${L(al.title)} — ${L(al.place)}`, cap: L(al.title), href: URLS.album(a) });
        return `<figure data-i="${i}">${pic(a, n, `${L(al.title)} — ${L(al.place)} | fot. Arek Carphotography`,
          b.photos.length === 1 ? "(max-width: 860px) 100vw, 820px" : "(max-width: 700px) 100vw, 400px")}</figure>`;
      }).join("") + `</div>`;
    }
    if (b.album) html += `<a class="alink" href="${URLS.album(b.album)}">${t("blog.album")}</a>`;
    return html;
  };
  const body = P.body.map(block).join("");
  const others = POSTS.filter(x => x !== P);

  $("#page").innerHTML = `
  <section class="ahero" style="padding:0">
    ${pic(P.img[0], P.img[1], title, "100vw", 'fetchpriority="high"')}
    <div class="wrap">
      <nav class="crumbs" aria-label="breadcrumb"><a href="${URLS.home()}">${t("album.home")}</a><span>/</span><a href="${URLS.home()}#blog">${t("nav.blog")}</a></nav>
      <h1>${title}</h1>
      <div class="ameta"><span><b>●</b> <time datetime="${P.date}">${fmtDate(P.date)}</time></span><span>Arek Carphotography</span></div>
    </div>
  </section>
  <section style="padding-top:clamp(40px,6vw,72px)"><div class="wrap">
    <article class="article" id="article">
      <a class="back" href="${URLS.home()}#blog">${t("blog.back")}</a>
      ${body}
      ${TR ? `<p style="margin-top:36px"><a class="btn" href="${URLS.trip(TR.slug)}">${t("blog.trip")}</a></p>` : ""}
    </article>
  </div></section>
  <section class="related"><div class="wrap">
    <div class="reveal"><h2>${t("blog.other")}</h2></div>
    <div class="posts">${others.map(p => `<article class="post reveal"><a href="${URLS.post(p.slug)}">
      ${pic(p.img[0], p.img[1], L(p.t), "(max-width: 700px) 100vw, 50vw")}<time datetime="${p.date}">${fmtDate(p.date)}</time>
      <h3>${L(p.t)}</h3><p>${L(p.d)}</p><span class="more">${t("blog.more")}</span></a></article>`).join("")}</div>
  </div></section>`;

  $("#article").onclick = e => { const f = e.target.closest("figure[data-i]"); if (f) openLB(items, +f.dataset.i); };
  requestAnimationFrame(() => $(".ahero").classList.add("ready"));

  // Dane strukturalne wpisu dla Google
  let ld = $("#ld"); if (!ld) { ld = document.createElement("script"); ld.type = "application/ld+json"; ld.id = "ld"; document.head.append(ld); }
  ld.textContent = JSON.stringify({ "@context": "https://schema.org", "@type": "BlogPosting", headline: title, description: L(P.d),
    datePublished: P.date, inLanguage: LANG, image: photo(P.img[0], P.img[1], 1280),
    author: { "@type": "Person", name: "Arek", url: SITE_URL + "/" } });
};
applyLang();
</script>
</body>
</html>
