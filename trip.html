<title>Arek Carphotography</title>
<meta name="description" content="">

<!-- SEO:END -->
<meta name="theme-color" content="#0d0d0d">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>
<main id="page"></main>

<script src="assets/photos.js?v=20261119g"></script>
<script src="assets/data.js?v=20261119g"></script>
<script src="assets/app.js?v=20261119g"></script>
<script>
const wslug = PAGE.slug || new URLSearchParams(location.search).get("w");
const W = TRIPS.find(x => x.slug === wslug) || TRIPS[0];
if (!PAGE.slug && wslug && TRIPS.some(x => x.slug === wslug)) location.replace(URLS.trip(wslug));

window.renderPage = () => {
  const title = L(W.title), al = tripAlbums(W);
  const total = tripPhotos(W);
  document.title = `${title} — ${L(W.place)} | Arek Carphotography`;
  $('meta[name="description"]').content = L(W.desc);

  // Najlepsze kadry z całego wyjazdu: więcej z albumów zbiorczych (krajobraz, ludzie, atmosfera), mniej z albumów aut — przeplatane
  const pick = (list, n) => Array.from({ length: Math.min(n, list.length) }, (_, i) => list[Math.floor(i * list.length / Math.min(n, list.length))]);
  const groups = al.map(a => photoItems(a, pick(a.photos, a.kind === "event" ? 8 : 3), true));
  const items = []; while (groups.some(g => g.length)) groups.forEach(g => g.length && items.push(g.shift()));
  const [ca, cn] = W.cover;

  $("#page").innerHTML = `
  <section class="ahero" style="padding:0">
    ${pic(ca, cn, `${title} — ${L(W.place)}`, "100vw", 'fetchpriority="high"')}
    <div class="wrap">
      <nav class="crumbs" aria-label="breadcrumb"><a href="${URLS.home()}">${t("album.home")}</a><span>/</span><a href="${URLS.home()}#albums">${t("album.albums")}</a><span>/</span>${title}</nav>
      <h1>${title}</h1>
      <div class="ameta"><span><b>●</b> ${L(W.place)}</span><span>${fmtRange(W.dates)}</span><span>${albumsLabel(al.length)}</span><span>${photosLabel(total)}</span></div>
    </div>
  </section>
  <section style="padding-top:clamp(40px,6vw,72px)"><div class="wrap">
    <p class="adesc reveal">${L(W.desc)}</p>
    <div class="reveal"><div class="eyebrow">${t("trip.label")}</div><h2>${t("trip.albums")}</h2></div>
    <div class="albums">${al.map(albumCard).join("")}</div>
  </div></section>
  <section style="padding-top:0"><div class="wrap">
    <div class="reveal"><h2>${t("trip.highlights")}</h2></div>
    <div class="grid" id="grid">${gridHTML(items)}</div>
  </div></section>`;
  bindGrid($("#grid"), items);
  requestAnimationFrame(() => $(".ahero").classList.add("ready"));

  let ld = $("#ld"); if (!ld) { ld = document.createElement("script"); ld.type = "application/ld+json"; ld.id = "ld"; document.head.append(ld); }
  ld.textContent = JSON.stringify({ "@context": "https://schema.org", "@type": "CollectionPage", name: title, description: L(W.desc),
    contentLocation: { "@type": "Place", name: L(W.place) },
    hasPart: al.map(a => ({ "@type": "ImageGallery", name: L(a.title), url: `${SITE_URL}/albumy/${a.slug}/` })) });
};
applyLang();
</script>
</body>
</html>
